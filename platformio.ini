; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc1-n16r8]
platform = espressif32
board = esp32-s3-devkitc1-n16r8
framework = arduino
;monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_80:B5:4E:D9:25:FC-if00
;upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_80:B5:4E:D9:25:FC-if00
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_80:B5:4E:D7:B6:00-if00
upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_80:B5:4E:D7:B6:00-if00

monitor_speed = 115200
upload_speed = 115200
monitor_dtr = 0
monitor_rts = 0
build_flags = 
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps = 
	bodmer/TFT_eSPI@^2.5.43
	adafruit/Adafruit NeoPixel@^1.15.4
